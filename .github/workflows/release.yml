# Al subir una etiqueta vX.Y.Z: compila, empaqueta VoidDeck-vX.Y.Z.zip y publica la Release con el zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Comprobar que la etiqueta coincide con package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con package.json ($version)"
            exit 1
          fi

      - run: pnpm typecheck

      - run: pnpm package

      - uses: softprops/action-gh-release@v2
        with:
          files: out/VoidDeck-${{ github.ref_name }}.zip
          generate_release_notes: true
