# Pushing a vX.Y.Z tag builds, packages VoidDeck-vX.Y.Z.zip, and publishes the Release with the ZIP.
# The same build can be re-run on demand from the Actions tab (Run workflow).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (must match the version in package.json, Panel.tsx and README.md)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The tag to publish, read through the environment so a dispatch input can never be inlined into the script.
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      # On failure, the end of the log is an annotation (visible without opening the full log).
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile > install.log 2>&1 || {
            cat install.log
            echo "::error title=pnpm install::$(tail -n 25 install.log | tr '\n' ' ')"
            exit 1
          }

      # The version lives in three files; all of them have to match the tag being published.
      - name: Verify that the tag matches the version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          check() {
            if [ "$2" != "$RELEASE_TAG" ]; then
              echo "::error title=Version mismatch::$1 is $2 but the release tag is $RELEASE_TAG"
              exit 1
            fi
          }
          check package.json "v$(node -p "require('./package.json').version")"
          check Panel.tsx "v$(sed -n 's/.*const VERSION = "\([0-9.]*\)".*/\1/p' src/qam/Panel.tsx | head -n 1)"
          check README.md "$(sed -n 's|.*releases/tag/\(v[0-9.]*\).*|\1|p' README.md | head -n 1)"

      - run: pnpm typecheck

      - run: pnpm package

      # Use notes in .github/release-notes/<tag>.md when available; otherwise generate GitHub's notes.
      - name: Select release notes
        id: notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          file=".github/release-notes/${RELEASE_TAG}.md"
          if [ -f "$file" ]; then echo "body_path=$file" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: out/VoidDeck-${{ steps.release.outputs.tag }}.zip
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
