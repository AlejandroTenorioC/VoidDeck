# Pushing a vX.Y.Z tag builds, packages VoidDeck-vX.Y.Z.zip, and publishes the Release with the ZIP.
# The same build can be re-run on demand from the Actions tab (Run workflow).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (must match the package.json version)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The tag to publish, read through the environment so a dispatch input can never be inlined into the script.
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # On failure, the end of the log is an annotation (visible without opening the full log).
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile > install.log 2>&1 || {
            cat install.log
            echo "::error title=pnpm install::$(tail -n 25 install.log | tr '\n' ' ')"
            exit 1
          }

      - name: Verify that the tag matches package.json
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match package.json ($version)"
            exit 1
          fi

      - run: pnpm typecheck

      - run: pnpm package

      # Use notes in .github/release-notes/<tag>.md when available; otherwise generate GitHub's notes.
      - name: Select release notes
        id: notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          file=".github/release-notes/${RELEASE_TAG}.md"
          if [ -f "$file" ]; then echo "body_path=$file" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: out/VoidDeck-${{ steps.release.outputs.tag }}.zip
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
